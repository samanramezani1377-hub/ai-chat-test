name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle :core:actions:test :core:agent:test :core:conversation:test :core:domain:test :core:observability:test :core:runtime:test :core:settings:test :core:runtime-android:test :app:testDebugUnitTest --stacktrace --parallel

  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and ccache
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      # Vulkan is needed only by the native Android build. Cache the SDK itself,
      # not CMake's dependency/source tree; the latter was restoring large,
      # partially patched state and made llama.cpp configuration non-deterministic.
      - name: Restore Vulkan SDK
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Prepare Vulkan SDK
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      # ccache is an optimization only. Correctness never depends on it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2
          restore-keys: |
            ci-ccache-${{ runner.os }}-ndk27.2-

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APKs
        id: build-apks
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --zero-stats
          # No .cxx/FetchContent cache is restored here. CMake gets a clean
          # pinned llama.cpp checkout and applies exactly one deterministic patch.
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --parallel
          ccache --show-stats

      - name: Save ccache
        if: steps.build-apks.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
