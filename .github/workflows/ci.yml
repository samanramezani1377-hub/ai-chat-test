name: Android GPU Engine CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    name: Native engine contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify standalone engine structure
        run: bash scripts/verify_gpu_engine_independence.sh
      - name: Build and run C++ contract tests
        run: bash scripts/test_gpu_engine_contracts.sh

      - name: Install pinned tokenizer reference runtime
        run: python3 -m pip install --disable-pip-version-check tokenizers==0.22.1

      - name: Verify Qwen3.5 tokenizer against Hugging Face reference
        run: bash scripts/test_qwen35_tokenizer_parity.sh

  android-apk:
    name: Build Android GPU engine test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "ndk;27.2.12479018"

      - name: Set up Go for Dawn generators
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=3G

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          # A per-run key prevented exact cache hits on reruns of the same commit.
          # Commit keys let reruns reuse the exact cache; the prefix restores the
          # newest compatible compiler objects after source changes.
          key: ccache-android-arm64-ndk27-dawn-alpha06-${{ github.sha }}
          restore-keys: |
            ccache-android-arm64-ndk27-dawn-alpha06-

      # Dawn and its pinned third-party sources are expensive to clone. Keep
      # FetchContent's source/dependency directory outside Gradle's disposable
      # .cxx build tree and cache it independently from compiler objects.
      - name: Restore pinned Dawn source cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/dawn
          # The AAR version pins the Dawn source revision. Do not use restore-keys
          # here: a different AAR revision must fetch its own exact sources.
          key: dawn-fetchcontent-androidx-alpha06-${{ hashFiles('engine/build.gradle.kts', 'engine/src/main/cpp/cmake/FindDawn.cmake') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Build test application
        run: |
          # Reset counters only; keep all cached compiler objects.
          ccache --zero-stats
          gradle --parallel :test-app:assembleDebug --stacktrace --console=plain
          ccache --show-stats

      # Publish the APK before optional symbol packaging so a symbol-path
      # problem can never suppress the installable test build.
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-gpu-engine-test-arm64-debug
          path: test-app/build/outputs/apk/debug/test-app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Debug symbols are optional: absence or discovery issues must not fail
      # the already successful APK build.
      - name: Locate native debug symbols
        id: native-symbols
        shell: bash
        continue-on-error: true
        run: |
          mapfile -t symbols < <(find engine -type f -name 'libgpu_engine_android.so.debug' -print)
          if ((${#symbols[@]} == 0)); then
            echo "No separate native debug-symbol file was generated."
            find engine -type f \( -name '*.so' -o -name '*.debug' \) -print | head -100
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Found native debug symbols: %s\n' "${symbols[@]}"
            printf '%s\n' "${symbols[@]}" > "$RUNNER_TEMP/native-debug-symbol-paths.txt"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload native debug symbols
        if: steps.native-symbols.outcome == 'success' && steps.native-symbols.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-gpu-engine-native-debug-symbols
          path: engine/**/libgpu_engine_android.so.debug
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
