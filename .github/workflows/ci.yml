name: CI

on:
  # Run CI for every branch, not only main. This keeps feature branches honest
  # and makes a new branch's first push trigger validation automatically.
  push:
    branches:
      - '**'
  # Validate pull requests targeting any branch, including non-main integration branches.
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and pull_request events for the same branch share one concurrency group.
  # This prevents two full Android/native builds for a single commit.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK and the pinned NDK
        uses: android-actions/setup-android@v4

      - name: Install the project's Android NDK
        shell: bash
        run: |
          set -euo pipefail
          packages=("ndk;27.2.12479018" "platforms;android-36")
          # sdkmanager occasionally receives a truncated/corrupt package archive.
          # Retry from a clean temporary download area instead of failing the job
          # on the first SeekableByteChannel/ZIP extraction error.
          for attempt in 1 2 3; do
            echo "Android SDK package install attempt ${attempt}/3"
            if sdkmanager --install "${packages[@]}"; then
              test -d "$ANDROID_HOME/ndk/27.2.12479018"
              test -d "$ANDROID_HOME/platforms/android-36"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SDK/NDK package installation failed; clearing incomplete downloads before retry."
              rm -rf "$ANDROID_HOME/temp" "$ANDROID_HOME/.temp"
              rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Could not install Android NDK 27.2.12479018 and Android platform 36 after 3 attempts."
          exit 1

      - name: Set up Rust for the official Laya tokenizer
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run JVM and Android unit tests
        run: >-
          gradle
          :core:actions:test
          :core:agent:test
          :core:conversation:test
          :core:domain:test
          :core:observability:test
          :core:runtime:test
          :core:runtime-android:test
          :core:settings:test
          :app:testDebugUnitTest
          --stacktrace
          --console=plain
          --parallel

  android-build:
    name: Android debug build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK and the pinned NDK
        uses: android-actions/setup-android@v4

      - name: Install the project's Android NDK
        shell: bash
        run: |
          set -euo pipefail
          packages=("ndk;27.2.12479018" "platforms;android-36")
          # sdkmanager occasionally receives a truncated/corrupt package archive.
          # Retry from a clean temporary download area instead of failing the job
          # on the first SeekableByteChannel/ZIP extraction error.
          for attempt in 1 2 3; do
            echo "Android SDK package install attempt ${attempt}/3"
            if sdkmanager --install "${packages[@]}"; then
              test -d "$ANDROID_HOME/ndk/27.2.12479018"
              test -d "$ANDROID_HOME/platforms/android-36"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SDK/NDK package installation failed; clearing incomplete downloads before retry."
              rm -rf "$ANDROID_HOME/temp" "$ANDROID_HOME/.temp"
              rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Could not install Android NDK 27.2.12479018 and Android platform 36 after 3 attempts."
          exit 1

      - name: Set up Rust for the official Laya tokenizer
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Cache native CMake state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
            rs-laya-tokenizers/target
          key: >-
            native-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'app/build.gradle.kts',
              'gradle/libs.versions.toml',
              'rs-laya-tokenizers/Cargo.toml',
              'rs-laya-tokenizers/src/**',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**'
            ) }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Install and cache native compiler cache
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --version
          ccache -M "$CCACHE_MAXSIZE"
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-${{ runner.os }}-ndk27-arm64-
            ${{ hashFiles(
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**'
            ) }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27-arm64-

      - name: Verify ONNX Runtime GenAI integration invariants
        run: |
          set -euo pipefail
          grep -q 'ModelFormat.ONNX_GENAI' core/runtime/src/main/kotlin/com/woogit/aicore/runtime/LocalModelService.kt
          grep -q 'class OnnxGenAiModelImporter' core/runtime/src/main/kotlin/com/woogit/aicore/runtime/OnnxGenAiModelImporter.kt
          grep -q 'genai_config.json' core/runtime/src/main/kotlin/com/woogit/aicore/runtime/OnnxGenAiModelImporter.kt
          grep -q 'rawName.split.*any.*\.\.' core/runtime/src/main/kotlin/com/woogit/aicore/runtime/OnnxGenAiModelImporter.kt
          grep -q 'class OnnxRuntimeGenAiAndroidRuntimeAdapter' core/runtime-android/src/main/kotlin/com/woogit/aicore/runtime/android/OnnxRuntimeGenAiAndroidRuntimeAdapter.kt
          grep -q 'onnxruntime-genai-android-\$genAiVersion.aar' core/runtime-android/build.gradle.kts
          grep -q 'c149c24af368825701314b0200b737890f6fd72c610b0c97e421c43943df0826' core/runtime-android/build.gradle.kts
          ! grep -R 'LlamaCppAndroidRuntimeAdapter\|NativeLlamaCpp\|LLAMA_CPP_TAG\|GGML_OPENCL' -n app/src/main core/runtime-android core/runtime/src/main/kotlin
          echo "ONNX Runtime GenAI package import, activation, generation and pinned SDK wiring verified"

      - name: Assemble debug APK
        run: >-
          gradle
          :core:runtime-android:assembleDebug
          :app:assembleDebug
          --stacktrace
          --console=plain
          --parallel

      - name: Verify sherpa ONNX Runtime native linkage
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime4j_jni.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/liblaya_tokenizers.so'
          unzip -p "$apk" lib/arm64-v8a/libonnxruntime4j_jni.so > "$RUNNER_TEMP/libonnxruntime4j_jni.so"
          readelf -d --wide "$RUNNER_TEMP/libonnxruntime4j_jni.so" | grep -F 'libonnxruntime.so'
          unzip -p "$apk" lib/arm64-v8a/libonnxruntime.so > "$RUNNER_TEMP/libonnxruntime.so"
          # Do not pipe readelf directly into grep -q under pipefail: grep may
          # exit early and cause readelf to receive SIGPIPE, producing a false failure.
          readelf --dyn-syms --wide "$RUNNER_TEMP/libonnxruntime.so" > "$RUNNER_TEMP/onnxruntime-symbols.txt"
          # Match only a DEFINED dynamic symbol. A plain grep also matches UND
          # entries and previously let a broken runtime/JNI pairing pass CI.
          if ! awk '$7 != "UND" && $8 ~ /^OrtGetApiBase([@].*)?$/ { found=1 } END { exit !found }' "$RUNNER_TEMP/onnxruntime-symbols.txt"; then
            echo "::error::Packaged libonnxruntime.so does not DEFINE OrtGetApiBase required by libonnxruntime4j_jni.so"
            echo "ONNX Runtime dynamic symbols containing 'OrtGetApiBase':"
            grep -F 'OrtGetApiBase' "$RUNNER_TEMP/onnxruntime-symbols.txt" || true
            unzip -p "$apk" lib/arm64-v8a/libonnxruntime4j_jni.so > "$RUNNER_TEMP/libonnxruntime4j_jni.so"
            echo "ONNX Runtime JNI dynamic dependencies:"
            readelf -d --wide "$RUNNER_TEMP/libonnxruntime4j_jni.so" | grep -E 'NEEDED|SONAME' || true
            exit 1
          fi
          unzip -p "$apk" lib/arm64-v8a/libsherpa-onnx-jni.so > "$RUNNER_TEMP/libsherpa-onnx-jni.so"
          if readelf -d --wide "$RUNNER_TEMP/libsherpa-onnx-jni.so" | grep -F 'Shared library: [libonnxruntime.so]' > /dev/null; then
            echo "::error::sherpa JNI still dynamically depends on libonnxruntime.so; static-link AAR was not used"
            exit 1
          fi
          echo "Verified: Laya JNI and its defined OrtGetApiBase are from the same ORT AAR; sherpa ORT is statically linked."

      - name: Verify ONNX Runtime GenAI native linkage
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime-genai.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime-genai-jni.so'
          unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libonnxruntime.so'
          unzip -p "$apk" lib/arm64-v8a/libonnxruntime-genai.so > "$RUNNER_TEMP/libonnxruntime-genai.so"
          readelf -d --wide "$RUNNER_TEMP/libonnxruntime-genai.so" > "$RUNNER_TEMP/genai-deps.txt"
          grep -q 'libonnxruntime.so' "$RUNNER_TEMP/genai-deps.txt"
          echo "Verified ONNX Runtime GenAI arm64 libraries are packaged with the matching ONNX Runtime."

      - name: Verify APK ABI and size budget
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$apk"
          size_bytes="$(stat -c "%s" "$apk")"
          size_mib="$((size_bytes / 1024 / 1024))"
          echo "APK: $apk"
          echo "APK size: ${size_mib} MiB (${size_bytes} bytes)"
          echo "Largest packaged entries:"
          unzip -l "$apk" | sort -nr | head -n 18 || true
          unexpected_abis="$(unzip -Z1 "$apk" | grep -E "^lib/[^/]+/" | cut -d/ -f2 | sort -u | grep -v "^arm64-v8a$" || true)"
          if [ -n "$unexpected_abis" ]; then
            echo "::error::Unexpected native ABIs packaged: $unexpected_abis"
            exit 1
          fi
          if [ "$size_bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "::warning::Debug APK exceeds 100 MiB; keep the build artifact and review the size breakdown above."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  android-lint:
    name: Android lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK and the pinned NDK
        uses: android-actions/setup-android@v4

      - name: Install the project's Android NDK
        shell: bash
        run: |
          set -euo pipefail
          packages=("ndk;27.2.12479018" "platforms;android-36")
          # sdkmanager occasionally receives a truncated/corrupt package archive.
          # Retry from a clean temporary download area instead of failing the job
          # on the first SeekableByteChannel/ZIP extraction error.
          for attempt in 1 2 3; do
            echo "Android SDK package install attempt ${attempt}/3"
            if sdkmanager --install "${packages[@]}"; then
              test -d "$ANDROID_HOME/ndk/27.2.12479018"
              test -d "$ANDROID_HOME/platforms/android-36"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SDK/NDK package installation failed; clearing incomplete downloads before retry."
              rm -rf "$ANDROID_HOME/temp" "$ANDROID_HOME/.temp"
              rm -rf "$ANDROID_HOME/ndk/27.2.12479018"
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Could not install Android NDK 27.2.12479018 and Android platform 36 after 3 attempts."
          exit 1

      - name: Set up Rust for the official Laya tokenizer
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Cache exact native build state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
          key: >-
            native-lint-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'gradle/libs.versions.toml',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**'
            ) }}
          restore-keys: |
            native-lint-${{ runner.os }}-

      - name: Run Android lint
        run: >-
          gradle
          :app:lintDebug
          --stacktrace
          --console=plain
          --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7

