name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Restore Vulkan SDK
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-${{ github.run_id }}-1.4.321.1
          restore-keys: |
            ci-vulkan-${{ runner.os }}-1.4.321.1-

      - name: Prepare Vulkan SDK
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-${{ github.run_id }}-1.4.321.1

      - name: Restore native CMake cache
        uses: actions/cache/restore@v4
        with:
          path: core/runtime-android/.cxx
          key: ci-llama-cpp-${{ runner.os }}-${{ github.run_id }}-${{ hashFiles('core/runtime-android/src/main/cpp/CMakeLists.txt', 'core/runtime-android/src/main/cpp/native_runtime.cpp') }}
          restore-keys: |
            ci-llama-cpp-${{ runner.os }}-${{ hashFiles('core/runtime-android/src/main/cpp/CMakeLists.txt', 'core/runtime-android/src/main/cpp/native_runtime.cpp') }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Save native CMake cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: core/runtime-android/.cxx
          key: ci-llama-cpp-${{ runner.os }}-${{ github.run_id }}-${{ hashFiles('core/runtime-android/src/main/cpp/CMakeLists.txt', 'core/runtime-android/src/main/cpp/native_runtime.cpp') }}
