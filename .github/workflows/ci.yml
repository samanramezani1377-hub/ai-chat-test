name: CI

on:
  push:
    branches:
      - main
      - vulkan
  pull_request:
    branches:
      - main
      - vulkan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore Vulkan SDK cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Prepare Vulkan SDK and shader compiler
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Run JVM and Android unit tests
        run: >-
          gradle
          :core:actions:test
          :core:agent:test
          :core:conversation:test
          :core:domain:test
          :core:observability:test
          :core:runtime:test
          :core:runtime-android:test
          :core:settings:test
          :app:testDebugUnitTest
          --stacktrace
          --console=plain
          --parallel

  android-build:
    name: Android debug build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Restore Vulkan SDK cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Prepare Vulkan SDK and shader compiler
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Cache exact native build state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
          key: >-
            native-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'gradle/libs.versions.toml',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**',
              '.github/workflows/ci.yml'
            ) }}

      - name: Verify Vulkan GPU-only runtime invariants
        run: |
          set -euo pipefail
          grep -q 'GGML_VULKAN ON' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'GGML_OPENCL OFF' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'ggml-vulkan' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'VULKAN_GPU_ONLY_NO_CPU_FALLBACK' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q 'LLAMA_FLASH_ATTN_TYPE_DISABLED' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q 'cp.n_ubatch = std::min<uint32_t>(cp.n_ctx, 32)' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q 'NATIVE_FATAL_PHASE=' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q 'hybrid_recurrent_vulkan_stability' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q 'AI_CHAT_GPU_BACKEND_VULKAN=1' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_VULKAN_ANDROID_BDA_GUARD_V1' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_SELECTIVE_CPU_OP_FALLBACK_V1' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_BACKEND_ASSIGNMENT_PROFILE_V1' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'GGML_LOG_DEBUG("%s' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'ai_chat_append_native_trace' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'extern "C" void ai_chat_append_native_trace' core/runtime-android/src/main/cpp/native_runtime.cpp
          grep -q '!it.contains("NATIVE_PERF_PROFILE")' app/src/main/java/com/samanramezani/aichattest/ui/diagnostics/RuntimeDiagnostic.kt
          grep -q 'NATIVE_PERF_PROFILE' core/runtime-android/src/main/cpp/native_runtime_android_safe.cpp
          grep -q 'decodeCallMinUs' core/runtime-android/src/main/cpp/native_runtime_android_safe.cpp
          ! grep -q 'AI_CHAT_GPU_ONLY_NO_CPU_COMPUTE_FALLBACK' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_ANDROID_DISABLE_DSV4_HC_VULKAN_V1' core/runtime-android/src/main/cpp/CMakeLists.txt
          ! grep -R 'OPENCL_GPU_ONLY\|NATIVE_OPENCL_DEVICE\|cl_profiling.csv\|OpenClGpuProfile' -n app core/runtime core/runtime-android
          ! grep -R 'GGML_OPENCL=ON\|GGML_OPENCL ON\|AI_CHAT_OPENCL_PROFILING\|ggml-opencl.h\|android_opencl_dispatch' -n core/runtime-android/src/main/cpp core/runtime-android/build.gradle.kts
          echo "Vulkan GPU-only/no-OpenCL invariants verified"

      - name: Assemble debug APK
        run: >-
          gradle
          :core:runtime-android:assembleDebug
          :app:assembleDebug
          --stacktrace
          --console=plain
          --parallel

      - name: Verify Vulkan shader generation and static backend linkage
        run: |
          set -euo pipefail
          test -f "$VULKAN_SDK/bin/glslc"
          native_dirs=()
          for dir in core/runtime-android/.cxx core/runtime-android/src/.cxx; do
            if [ -d "$dir" ]; then native_dirs+=( "$dir" ); fi
          done
          test "${#native_dirs[@]}" -gt 0
          grep -R 'GGML_VULKAN' "${native_dirs[@]}" >/dev/null
          grep -R 'ggml-vulkan' "${native_dirs[@]}" >/dev/null
          grep -R 'vulkan-shaders-gen' "${native_dirs[@]}" >/dev/null
          vulkan_source="$(find core/runtime-android -path '*/llama_cpp-src/ggml/src/ggml-vulkan/ggml-vulkan.cpp' -print -quit)"
          test -n "$vulkan_source"
          grep -q 'AI_CHAT_VULKAN_ANDROID_BDA_GUARD_V1' "$vulkan_source"
          echo "Vulkan backend target and shader generation verified"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-lint:
    name: Android lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore Vulkan SDK cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Prepare Vulkan SDK and shader compiler
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Cache exact native build state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
          key: >-
            native-lint-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'gradle/libs.versions.toml',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**',
              '.github/workflows/ci.yml'
            ) }}

      - name: Run Android lint
        run: >-
          gradle
          :app:lintDebug
          --stacktrace
          --console=plain
          --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
