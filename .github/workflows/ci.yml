name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :core:actions:test :core:agent:test :core:conversation:test :core:domain:test :core:observability:test :core:runtime:test :core:settings:test :app:testDebugUnitTest --stacktrace --parallel

  build:
    name: Android Debug Build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --parallel --rerun-tasks
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
