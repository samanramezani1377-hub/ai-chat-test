name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and ccache
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Restore Vulkan SDK
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1
          restore-keys: |
            ci-vulkan-${{ runner.os }}-1.4.321.1-

      - name: Prepare Vulkan SDK
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      # CMake configuration/dependency state is independent of native_runtime.cpp.
      # Keep this cache stable across native source edits so a diagnostics change
      # does not invalidate the entire llama.cpp/ggml build tree.
      - name: Restore native CMake cache
        uses: actions/cache/restore@v4
        with:
          path: core/runtime-android/.cxx
          key: ci-llama-cmake-${{ runner.os }}-ndk27.2-${{ hashFiles('core/runtime-android/build.gradle.kts', 'core/runtime-android/src/main/cpp/CMakeLists.txt', 'ci/prepare-vulkan.sh') }}
          restore-keys: |
            ci-llama-cmake-${{ runner.os }}-ndk27.2-

      - name: Inspect native dependency cache
        run: |
          echo "Cached FetchContent directories:"
          find core/runtime-android/.cxx/fetch-content -maxdepth 3 -type d -name 'llama_cpp-src' -print 2>/dev/null || true
          echo "Cached llama source markers:"
          find core/runtime-android/.cxx/fetch-content -maxdepth 5 -type f -name 'CMakeLists.txt' -path '*llama_cpp-src/*' -print 2>/dev/null | head -20 || true

      # ccache is content/compiler based; source-file hashes in the cache key only
      # make the cache unnecessarily cold whenever native code changes.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2
          restore-keys: |
            ci-ccache-${{ runner.os }}-ndk27.2-
            ci-ccache-${{ runner.os }}-

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APKs
        id: build-apks
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --zero-stats
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --parallel
          ccache --show-stats

      - name: Save native CMake cache
        if: steps.build-apks.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: core/runtime-android/.cxx
          key: ci-llama-cmake-${{ runner.os }}-ndk27.2-${{ hashFiles('core/runtime-android/build.gradle.kts', 'core/runtime-android/src/main/cpp/CMakeLists.txt', 'ci/prepare-vulkan.sh') }}

      - name: Save ccache
        if: steps.build-apks.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  debug:
    name: Debug Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Debug unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
