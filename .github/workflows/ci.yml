name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2
        run: sdkmanager "ndk;27.2.12479018"

      - name: Prepare pinned llama.rn sources for llama.kt bootstrap
        run: |
          rm -rf /tmp/llama.rn-ref
          git clone --filter=blob:none --no-checkout https://github.com/mybigday/llama.rn /tmp/llama.rn-ref
          git -C /tmp/llama.rn-ref fetch --depth 1 origin 7afb5c8934aea7fa41f4522662f03b3461916927
          git -C /tmp/llama.rn-ref checkout --detach 7afb5c8934aea7fa41f4522662f03b3461916927
          test "$(git -C /tmp/llama.rn-ref rev-parse HEAD)" = "7afb5c8934aea7fa41f4522662f03b3461916927"
          test -f /tmp/llama.rn-ref/cpp/rn-llama.cpp
          test -f /tmp/llama.rn-ref/cpp/rn-llama.h

      - name: Apply downstream llama.rn abort patch
        run: |
          cp ci/patches/0002-abort-callback-mid-graph-cancel.patch libs/llama.kt/patches/0002-abort-callback-mid-graph-cancel.patch

      - name: Bootstrap llama.cpp sources
        run: bash libs/llama.kt/scripts/bootstrap.sh

      - name: Build OpenCL loader
        run: bash libs/llama.kt/scripts/build-opencl.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build and test
        run: gradle build --parallel --no-daemon

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
