name: Android GPU Engine CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    name: Native engine contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify standalone engine structure
        run: bash scripts/verify_gpu_engine_independence.sh
      - name: Build and run C++ contract tests
        run: bash scripts/test_gpu_engine_contracts.sh

  android-apk:
    name: Build Android GPU engine test APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "ndk;27.2.12479018"

      - name: Set up Go for Dawn generators
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=3G

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-android-arm64-ndk27-dawn-alpha06-${{ hashFiles('engine/src/main/cpp/CMakeLists.txt', 'engine/src/main/cpp/cmake/FindDawn.cmake') }}
          restore-keys: |
            ccache-android-arm64-ndk27-dawn-alpha06-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Build test application
        run: |
          # Reset counters only; keep all cached compiler objects.
          ccache --zero-stats
          gradle --parallel :test-app:assembleDebug --stacktrace --console=plain
          ccache --show-stats

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-gpu-engine-native-debug-symbols
          path: engine/.cxx/**/libgpu_engine_android.so.debug
          if-no-files-found: error
          retention-days: 14

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-gpu-engine-test-arm64-debug
          path: test-app/build/outputs/apk/debug/test-app-debug.apk
          if-no-files-found: error
          retention-days: 14
