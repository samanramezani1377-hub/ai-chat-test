name: CI

on:
  push:
    branches:
      - main
      - OpenGL
  pull_request:
    branches:
      - main
      - OpenGL
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run JVM and Android unit tests
        run: >-
          gradle
          :core:actions:test
          :core:agent:test
          :core:conversation:test
          :core:domain:test
          :core:observability:test
          :core:runtime:test
          :core:runtime-android:test
          :core:settings:test
          :app:testDebugUnitTest
          --stacktrace
          --console=plain
          --parallel

  android-build:
    name: Android debug build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Android SDK
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: Cache exact native build state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
          key: >-
            native-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'gradle/libs.versions.toml',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**',
              '.github/workflows/ci.yml'
            ) }}

      - name: Verify generic OpenGL ES GPU-only invariants
        run: |
          set -euo pipefail
          test -f core/runtime-android/src/main/cpp/opengles_runtime.cpp
          test -f core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          test -f core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles-registration.cpp
          ! grep -R -nE 'GGML_USE_OPENCL|ggml-opencl|OpenCL|Vulkan' core/runtime-android/src/main/cpp core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_GPU_BACKEND_OPENGL=1' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_REQUIRE_OPENGL_GPU=1' core/runtime-android/src/main/cpp/CMakeLists.txt
          ! grep -R -nE 'GGML_OPENCL=ON|AI_CHAT_OPENCL|OPENCL_PROFILING' core/runtime-android/build.gradle.kts core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'AI_CHAT_GPU_ONLY_SCHEDULER_PATCH' core/runtime-android/src/main/cpp/CMakeLists.txt
          grep -q 'OpenGL ES' core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          grep -q 'GGML_OP_GET_ROWS' core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          grep -q 'GGML_TYPE_Q4_0' core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          grep -q 'GGML_TYPE_Q6_K' core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          grep -q 'GGML_TYPE_Q8_0' core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp
          echo "Generic OpenGL ES GPU-only invariants verified"

      - name: Assemble debug APK
        run: >-
          gradle
          :core:runtime-android:assembleDebug
          :app:assembleDebug
          --stacktrace
          --console=plain
          --parallel

      - name: Verify OpenGL ES static backend linkage
        run: |
          set -euo pipefail
          source_file="core/runtime-android/src/main/cpp/ggml-opengles/ggml-opengles.cpp"
          test -f "$source_file"
          grep -q 'GGML_OP_GET_ROWS' "$source_file"
          grep -q 'GGML_TYPE_Q4_0' "$source_file"
          grep -q 'GGML_TYPE_Q6_K' "$source_file"
          grep -q 'GGML_TYPE_Q8_0' "$source_file"

          gl_target="$(find core/runtime-android -path '*/.cxx/*' -type f \( -name 'build.ninja' -o -name 'rules.ninja' \) -print0 | xargs -0 grep -l 'ggml-opengles' | head -n 1 || true)"
          test -n "$gl_target"
          grep -R -n 'GLESv3' core/runtime-android/.cxx >/dev/null
          if grep -R -nE '(-lOpenCL|libOpenCL|OpenCL::|vulkan|Vulkan::|libvulkan)' core/runtime-android/.cxx >/dev/null 2>&1; then
            echo "Forbidden OpenCL/Vulkan linkage detected in native build output"
            exit 1
          fi
          echo "Static OpenGL ES backend linkage verified: $gl_target"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-lint:
    name: Android lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Cache exact native build state
        uses: actions/cache@v4
        with:
          path: |
            core/runtime-android/.cxx
            core/runtime-android/src/.cxx
          key: >-
            native-lint-${{ runner.os }}-
            ${{ hashFiles(
              'gradle.properties',
              'settings.gradle.kts',
              'build.gradle.kts',
              'gradle/libs.versions.toml',
              'core/runtime-android/build.gradle.kts',
              'core/runtime-android/src/main/cpp/**',
              'core/runtime-android/src/main/cpp/cmake/**',
              '.github/workflows/ci.yml'
            ) }}

      - name: Run Android lint
        run: >-
          gradle
          :app:lintDebug
          --stacktrace
          --console=plain
          --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
