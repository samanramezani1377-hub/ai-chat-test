name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned llama.kt submodule
        run: |
          set -euo pipefail
          git submodule sync -- libs/llama.kt
          git submodule update --init --depth=1 libs/llama.kt || {
            rm -rf libs/llama.kt .git/modules/libs/llama.kt
            git clone --depth=1 https://github.com/hokanosekai/llama.kt libs/llama.kt
            git -C libs/llama.kt fetch --depth=1 origin 5a20956b1fe2f40d07252f079c31bcaa08250e6b
            git -C libs/llama.kt checkout --detach 5a20956b1fe2f40d07252f079c31bcaa08250e6b
          }
          test "$(git -C libs/llama.kt rev-parse HEAD)" = "5a20956b1fe2f40d07252f079c31bcaa08250e6b"
          git -C libs/llama.kt submodule sync --recursive
          git -C libs/llama.kt submodule update --init --recursive

      - name: Pin llama.cpp revision used by llama.kt bootstrap
        run: |
          set -euo pipefail
          LLAMA_CPP_REV=c5fc7e34885ba31217e330809437afa993d27745
          cd libs/llama.kt
          test -d third_party/llama.cpp
          git -C third_party/llama.cpp fetch origin "$LLAMA_CPP_REV"
          git -C third_party/llama.cpp checkout --detach "$LLAMA_CPP_REV"
          git update-index --add --cacheinfo 160000,"$LLAMA_CPP_REV",third_party/llama.cpp
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REV"
          test "$(git ls-files -s third_party/llama.cpp | awk '{print $2}')" = "$LLAMA_CPP_REV"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore CI dependency caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            /tmp/llama.rn-ref
          key: ci-native-1-vulkan-1.4.321.1-llama-rn-7afb5c8934aea7fa41f4522662f03b3461916927

      - name: Restore llama.kt bootstrap output cache
        id: bootstrap-cache
        uses: actions/cache@v4
        with:
          path: /tmp/llama-kt-bootstrap-cache
          key: ci-bootstrap-1-llama-kt-5a20956b1fe2f40d07252f079c31bcaa08250e6b-llama-cpp-c5fc7e34885ba31217e330809437afa993d27745-llama-rn-7afb5c8934aea7fa41f4522662f03b3461916927-vulkan-1.4.321.1-ndk-27.2.12479018-${{ hashFiles('ci/patches/0002-abort-callback-mid-graph-cancel.patch') }}
          save-always: true

      - name: Prepare NDK, Vulkan SDK and llama.rn sources in parallel
        shell: bash
        run: |
          set -euo pipefail
          install_ndk() {
            echo '::group::Install NDK 27.2'
            sdkmanager "ndk;27.2.12479018"
            echo '::endgroup::'
          }
          install_vulkan() {
            echo '::group::Install pinned Vulkan SDK'
            VULKAN_VERSION=1.4.321.1
            VULKAN_ARCHIVE="vulkansdk-linux-x86_64-${VULKAN_VERSION}.tar.xz"
            VULKAN_SHA256=f22a3625bd4d7a32e7a0d926ace16d5278c149e938dac63cecc00537626cbf73
            if [ ! -s "/tmp/${VULKAN_ARCHIVE}" ]; then
              curl -L --fail --retry 3 -o "/tmp/${VULKAN_ARCHIVE}" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/${VULKAN_ARCHIVE}"
            else
              echo "Using cached Vulkan archive: /tmp/${VULKAN_ARCHIVE}"
            fi
            echo "${VULKAN_SHA256}  /tmp/${VULKAN_ARCHIVE}" | sha256sum -c -
            rm -rf "$HOME/vulkan-sdk"
            mkdir -p "$HOME/vulkan-sdk"
            tar -xf "/tmp/${VULKAN_ARCHIVE}" -C "$HOME/vulkan-sdk"
            VULKAN_SDK_PATH="$HOME/vulkan-sdk/${VULKAN_VERSION}/x86_64"
            export VULKAN_SDK="$VULKAN_SDK_PATH"
            export PATH="$VULKAN_SDK/bin:$PATH"
            export LD_LIBRARY_PATH="$VULKAN_SDK/lib:${LD_LIBRARY_PATH:-}"
            glslc --version
            printf 'VULKAN_SDK=%s\n' "$VULKAN_SDK_PATH" >> "$GITHUB_ENV"
            printf 'PATH=%s\n' "$VULKAN_SDK_PATH/bin:$PATH" >> "$GITHUB_ENV"
            printf 'LD_LIBRARY_PATH=%s\n' "$VULKAN_SDK_PATH/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo '::endgroup::'
          }
          prepare_llama_rn() {
            echo '::group::Prepare pinned llama.rn sources'
            if [ -d /tmp/llama.rn-ref/.git ]; then
              echo 'Using cached llama.rn repository'
              git -C /tmp/llama.rn-ref fetch --depth 1 origin 7afb5c8934aea7fa41f4522662f03b3461916927
              git -C /tmp/llama.rn-ref checkout --detach 7afb5c8934aea7fa41f4522662f03b3461916927
            else
              rm -rf /tmp/llama.rn-ref
              git clone --filter=blob:none --no-checkout https://github.com/mybigday/llama.rn /tmp/llama.rn-ref
              git -C /tmp/llama.rn-ref fetch --depth 1 origin 7afb5c8934aea7fa41f4522662f03b3461916927
              git -C /tmp/llama.rn-ref checkout --detach 7afb5c8934aea7fa41f4522662f03b3461916927
            fi
            test "$(git -C /tmp/llama.rn-ref rev-parse HEAD)" = "7afb5c8934aea7fa41f4522662f03b3461916927"
            test -f /tmp/llama.rn-ref/cpp/rn-llama.cpp
            test -f /tmp/llama.rn-ref/cpp/rn-llama.h
            echo '::endgroup::'
          }
          install_ndk & ndk_pid=$!
          install_vulkan & vulkan_pid=$!
          prepare_llama_rn & llama_rn_pid=$!
          failed=0
          for pid in "$ndk_pid" "$vulkan_pid" "$llama_rn_pid"; do
            if ! wait "$pid"; then failed=1; fi
          done
          exit "$failed"

      - name: Bootstrap llama.cpp and apply downstream patch
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_CACHE_DIR=/tmp/llama-kt-bootstrap-cache
          CPP_DIR=libs/llama.kt/llama-kt/src/main/cpp
          LLAMA_CPP_DIR=libs/llama.kt/third_party/llama.cpp
          apply_downstream_patch() {
            cp ci/patches/0002-abort-callback-mid-graph-cancel.patch libs/llama.kt/patches/0002-abort-callback-mid-graph-cancel.patch
            rm -f libs/llama.kt/patches/0001-vulkan-uma-descriptor-ceildiv.patch
          }
          restore_cached_bootstrap() {
            echo 'Bootstrap cache hit; restoring generated llama.kt native sources'
            rm -rf "$CPP_DIR"
            mkdir -p "$CPP_DIR"
            cp -a "$BOOTSTRAP_CACHE_DIR/cpp/." "$CPP_DIR/"
          }
          if [ -d "$BOOTSTRAP_CACHE_DIR" ] && [ -f "$BOOTSTRAP_CACHE_DIR/.complete" ]; then
            restore_cached_bootstrap
          else
            echo 'Bootstrap cache miss; running pinned llama.kt bootstrap'
            apply_downstream_patch
            bash libs/llama.kt/scripts/bootstrap.sh 2>&1 | tee bootstrap-output.log
            test "$(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)" = "c5fc7e34885ba31217e330809437afa993d27745"

            # Persist the raw bootstrap result immediately after bootstrap.sh succeeds.
            # This is deliberately before any project-specific header validation/copying,
            # so a later failure cannot force the expensive Vulkan shader compilation again.
            rm -rf "$BOOTSTRAP_CACHE_DIR"
            mkdir -p "$BOOTSTRAP_CACHE_DIR/cpp"
            cp -a "$CPP_DIR/." "$BOOTSTRAP_CACHE_DIR/cpp/"
            : > "$BOOTSTRAP_CACHE_DIR/.complete"
            echo 'Bootstrap output staged in cache; continuing with project-specific compatibility files'
          fi

          test "$(git -C "$LLAMA_CPP_DIR" rev-parse HEAD)" = "c5fc7e34885ba31217e330809437afa993d27745"

          test -f "$LLAMA_CPP_DIR/ggml/src/ggml-feats.h"
          cp "$LLAMA_CPP_DIR/ggml/src/ggml-feats.h" "$CPP_DIR/ggml-feats.h"
          sed -i 's/GGML_/LM_GGML_/g; s/ggml_/lm_ggml_/g' "$CPP_DIR/ggml-feats.h"
          test -s "$CPP_DIR/ggml-feats.h"
          grep -Fq 'lm_ggml_feats_arch64_runtime_t' "$CPP_DIR/ggml-feats.h"
          grep -Fq 'lm_ggml_feats_get_arch64_runtime' "$CPP_DIR/ggml-feats.h"

          # The pinned llama.cpp graph references these KV-cache implementations.
          # Bootstrap does not export all of their headers, so copy them explicitly
          # and apply the same LM_GGML namespace rewrite used for the generated tree.
          for header in llama-kv-cache-dsa-iswa.h llama-kv-cache-msa.h llama-kv-cache-dsv4.h; do
            test -f "$LLAMA_CPP_DIR/src/$header"
            cp "$LLAMA_CPP_DIR/src/$header" "$CPP_DIR/$header"
            sed -i 's/GGML_/LM_GGML_/g; s/ggml_/lm_ggml_/g' "$CPP_DIR/$header"
            test -s "$CPP_DIR/$header"
          done

          test -f "$LLAMA_CPP_DIR/tools/mtmd/mtmd-internal.h"
          cp "$LLAMA_CPP_DIR/tools/mtmd/mtmd-internal.h" "$CPP_DIR/tools/mtmd/mtmd-internal.h"
          test -s "$CPP_DIR/tools/mtmd/mtmd-internal.h"

          # The cache intentionally stores the raw bootstrap output. Project-specific
          # compatibility headers above are regenerated on every run from the pinned
          # llama.cpp revision, keeping the cache independent from those fixups.
          test -s "$CPP_DIR/llama-kv-cache-dsa-iswa.h"
          test -s "$CPP_DIR/llama-kv-cache-msa.h"
          test -s "$CPP_DIR/llama-kv-cache-dsv4.h"
          test -s "$CPP_DIR/ggml-feats.h"
          test -s "$CPP_DIR/tools/mtmd/mtmd-internal.h"

      - name: Apply llama.rn Barbet compatibility patches
        run: |
          set -euo pipefail
          cd libs/llama.kt/llama-kt/src/main/cpp
          patches=/tmp/llama.rn-ref/scripts/patches
          apply_if_missing() {
            local marker="$1"
            local patch_file="$2"
            if grep -Fq "$marker" "$3"; then return; fi
            patch -p0 --forward < "$patch_file"
            grep -Fq "$marker" "$3"
          }
          apply_if_missing 'LLM_ARCH_BARBET,' "$patches/barbet-llama-arch.h.patch" llama-arch.h
          apply_if_missing '{ LLM_ARCH_BARBET,           "barbet"           },' "$patches/barbet-llama-arch.cpp.patch" llama-arch.cpp
          apply_if_missing 'case LLM_ARCH_BARBET:' "$patches/barbet-llama-model.cpp.patch" llama-model.cpp
          apply_if_missing 'struct llama_model_barbet : public llama_model_base' "$patches/barbet-models.h.patch" models/models.h
          if [ -f "$patches/../vendor/models/barbet.cpp" ]; then
            cp "$patches/../vendor/models/barbet.cpp" models/barbet.cpp
          else
            test -f /tmp/llama.rn-ref/cpp/models/barbet.cpp
            cp /tmp/llama.rn-ref/cpp/models/barbet.cpp models/barbet.cpp
          fi
          test -s models/barbet.cpp
          grep -Fq 'llama_model_barbet::load_arch_hparams' models/barbet.cpp

      - name: Build OpenCL loader
        run: |
          set -o pipefail
          bash libs/llama.kt/scripts/build-opencl.sh 2>&1 | tee opencl-output.log

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build and test
        run: |
          set -o pipefail
          gradle build --parallel --no-daemon 2>&1 | tee build-output.log

      - name: Generate AI-readable build failure report
        if: failure()
        run: |
          {
            echo "# CI Build Failure Report"
            echo
            echo "## Execution"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Run number: ${GITHUB_RUN_NUMBER}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner OS: ${RUNNER_OS}"
            echo "- Runner architecture: ${RUNNER_ARCH}"
            echo
            echo "## Diagnostic guidance"
            echo "The CI can fail before Gradle. Diagnose the earliest failed stage and its first real error."
            echo "Warnings are not the root cause unless no error is present."
            echo
            for log in bootstrap-output.log opencl-output.log build-output.log; do
              if [ -s "$log" ]; then
                echo "## $log"
                echo '```text'
                cat "$log"
                echo '```'
                echo
              fi
            done
          } > ai-build-failure-report.md

      - name: Upload AI-readable build failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-build-failure-report
          path: ai-build-failure-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
