name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Run JVM and Android unit tests
        run: >-
          gradle
          :core:actions:test
          :core:agent:test
          :core:conversation:test
          :core:domain:test
          :core:observability:test
          :core:runtime:test
          :core:runtime-android:test
          :core:settings:test
          :app:testDebugUnitTest
          --stacktrace
          --console=plain
          --no-daemon
          --parallel

  android-build:
    name: Android debug build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Verify Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list >/dev/null

      - name: Assemble debug APK
        run: >-
          gradle
          :core:runtime-android:assembleDebug
          :app:assembleDebug
          --stacktrace
          --console=plain
          --no-daemon
          --parallel

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-lint:
    name: Android lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Android lint
        run: >-
          gradle
          :app:lintDebug
          --stacktrace
          --console=plain
          --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
