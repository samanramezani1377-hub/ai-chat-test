name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned llama.kt submodule
        run: |
          set -euo pipefail
          git submodule sync -- libs/llama.kt
          git submodule update --init --depth=1 libs/llama.kt || {
            rm -rf libs/llama.kt .git/modules/libs/llama.kt
            git clone --depth=1 https://github.com/hokanosekai/llama.kt libs/llama.kt
            git -C libs/llama.kt fetch --depth=1 origin 5a20956b1fe2f40d07252f079c31bcaa08250e6b
            git -C libs/llama.kt checkout --detach 5a20956b1fe2f40d07252f079c31bcaa08250e6b
          }
          test "$(git -C libs/llama.kt rev-parse HEAD)" = "5a20956b1fe2f40d07252f079c31bcaa08250e6b"
          git -C libs/llama.kt submodule sync --recursive
          git -C libs/llama.kt submodule update --init --depth=1 --recursive

      - name: Align llama.cpp revision used by llama.kt
        run: |
          set -euo pipefail
          test -d libs/llama.kt/third_party/llama.cpp
          git -C libs/llama.kt/third_party/llama.cpp fetch --depth=1 origin 91f8c9c5fb038c086e13e9cd823c29b33b07ba54
          git -C libs/llama.kt/third_party/llama.cpp checkout --detach 91f8c9c5fb038c086e13e9cd823c29b33b07ba54
          test "$(git -C libs/llama.kt/third_party/llama.cpp rev-parse HEAD)" = "91f8c9c5fb038c086e13e9cd823c29b33b07ba54"

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.2
        run: sdkmanager "ndk;27.2.12479018"

      - name: Prepare pinned llama.rn sources for llama.kt bootstrap
        run: |
          rm -rf /tmp/llama.rn-ref
          git clone --filter=blob:none --no-checkout https://github.com/mybigday/llama.rn /tmp/llama.rn-ref
          git -C /tmp/llama.rn-ref fetch --depth 1 origin 7afb5c8934aea7fa41f4522662f03b3461916927
          git -C /tmp/llama.rn-ref checkout --detach 7afb5c8934aea7fa41f4522662f03b3461916927
          test "$(git -C /tmp/llama.rn-ref rev-parse HEAD)" = "7afb5c8934aea7fa41f4522662f03b3461916927"
          test -f /tmp/llama.rn-ref/cpp/rn-llama.cpp
          test -f /tmp/llama.rn-ref/cpp/rn-llama.h

      - name: Apply downstream llama.rn abort patch
        run: |
          cp ci/patches/0002-abort-callback-mid-graph-cancel.patch libs/llama.kt/patches/0002-abort-callback-mid-graph-cancel.patch

      - name: Bootstrap llama.cpp sources
        run: bash libs/llama.kt/scripts/bootstrap.sh

      - name: Build OpenCL loader
        run: bash libs/llama.kt/scripts/build-opencl.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build and test
        run: |
          set -o pipefail
          gradle build --parallel --no-daemon 2>&1 | tee build-output.log

      - name: Generate AI-readable build failure report
        if: failure()
        run: |
          {
            echo "# CI Build Failure Report"
            echo
            echo "## Execution"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Run number: ${GITHUB_RUN_NUMBER}"
            echo "- Event: ${GITHUB_EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner OS: ${RUNNER_OS}"
            echo "- Runner architecture: ${RUNNER_ARCH}"
            echo
            echo "## Failed step"
            echo "- Step: Build and test"
            echo "- Command: gradle build --parallel --no-daemon"
            echo
            echo "## AI diagnosis input"
            echo "The following is the complete stdout/stderr captured from the failed Build and test step."
            echo "Use the first error and its surrounding context as the primary diagnostic signal."
            echo "Do not treat warnings as the root cause unless no error is present."
            echo
            echo "## Build log"
            echo '```text'
            cat build-output.log
            echo '```'
          } > ai-build-failure-report.md

      - name: Upload AI-readable build failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-build-failure-report
          path: ai-build-failure-report.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
