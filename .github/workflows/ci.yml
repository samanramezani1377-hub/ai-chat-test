name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle :core:actions:test :core:agent:test :core:conversation:test :core:domain:test :core:observability:test :core:runtime:test :core:settings:test :core:runtime-android:test :app:testDebugUnitTest --stacktrace --parallel

  build:
    name: Android Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and ccache
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      # Vulkan is needed only by the native Android build. Cache the SDK itself,
      # not CMake's dependency/source tree; the latter was restoring large,
      # partially patched state and made llama.cpp configuration non-deterministic.
      - name: Restore Vulkan SDK
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      - name: Prepare Vulkan SDK
        run: bash ci/prepare-vulkan.sh

      - name: Save Vulkan SDK cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/vulkansdk-linux-x86_64-1.4.321.1.tar.xz
            $HOME/vulkan-sdk
          key: ci-vulkan-${{ runner.os }}-1.4.321.1

      # ccache is an optimization only. Correctness never depends on it.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2
          restore-keys: |
            ci-ccache-${{ runner.os }}-ndk27.2-

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Every CI build validates the patch specifications against the exact
      # pinned llama.cpp revision. The generator ignores hunk line counts and
      # lets Git produce canonical unified diffs, so no manual line-count
      # editing or --recount workaround can enter the build path.
      # On push/dispatch, changed canonical patches are committed back to main.
      # On pull requests, the generator validates them in-place but never pushes.
      - name: Regenerate llama.cpp patches from pinned revision
        run: |
          python3 ci/regenerate-llama-patches.py .
          if [[ "${{ github.event_name }}" != "pull_request" ]] && ! git diff --quiet -- core/runtime-android/src/main/cpp/patches; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add core/runtime-android/src/main/cpp/patches
            git commit -m "chore: regenerate llama.cpp patches [skip ci]"
            git push
          fi

      # CMake/AGP native configuration must always start from a completely
      # fresh state. In particular, never reuse .cxx configuration, generated
      # CMake files, FetchContent state, or native build directories between CI
      # runs. This deliberately does NOT clear ccache: ccache only reuses
      # compiler objects and cannot provide stale CMake configuration.
      - name: Purge native CMake state
        run: |
          find . -type d \( -name .cxx -o -name cmake-build-debug \) -prune -exec rm -rf {} +
          find . -type d \( -path '*/build/cmake' -o -path '*/build/intermediates/cxx' \) -prune -exec rm -rf {} +
          rm -rf core/runtime-android/build app/.cxx app/build/.cxx

      - name: Build Debug APK
        id: build-debug
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --zero-stats
          # CI validation intentionally builds Debug only. Release remains a
          # release/tag concern and is not needed to validate native loading.
          # Native CMake state was explicitly purged immediately before this build.
          gradle :app:assembleDebug --stacktrace --parallel --rerun-tasks
          ccache --show-stats

      - name: Save ccache
        if: steps.build-debug.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ci-ccache-${{ runner.os }}-ndk27.2

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-test-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
