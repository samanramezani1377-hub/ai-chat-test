name: Regenerate llama.cpp patches once

on:
  push:

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, 'canonical llama.cpp patches') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate canonical patch stack
        env:
          ALLOW_LLAMA_PATCH_REGEN: "1"
        run: python3 ci/regenerate-llama-patches.py .
      - name: Verify generated patches directly
        run: python3 ci/verify-llama-patches.py .
      - name: Commit canonical patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/runtime-android/src/main/cpp/patches/*.patch
          if git diff --cached --quiet; then
            echo "No patch changes generated"
            exit 0
          fi
          git commit -m "Regenerate canonical llama.cpp patches"
          git push
