# Temporary migration workflow; delete after the canonical load-order fix is generated and verified.
name: Temporary Canonical Tensor Load Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
      - name: Generate canonical llama.cpp patch from pinned revision
        run: |
          set -euo pipefail
          TAG=c5fc7e34885ba31217e330809437afa993d27745
          WORK="$RUNNER_TEMP/llama-regenerate"
          rm -rf "$WORK"
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$WORK"
          git -C "$WORK" checkout --quiet --detach "$TAG"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          root = Path('.').resolve()
          work = Path(os.environ['RUNNER_TEMP']) / 'llama-regenerate'
          pd = root / 'core/runtime-android/src/main/cpp/patches'
          old_p1 = pd / 'llama-model-loading-memory.patch'
          p2 = pd / 'llama-backend-vulkan-diagnostics.patch'
          p3 = pd / 'llama-vulkan-micro-diagnostics.patch'
          tag = 'c5fc7e34885ba31217e330809437afa993d27745'
          def run(*args):
              return subprocess.run(args, cwd=work, check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout

          # Start from the exact pinned revision and apply only the existing model-loader
          # patch. The new Android model.cpp change is then added to that same canonical
          # patch so the checked-in patch stack remains exactly three patches.
          run('git', 'apply', '--recount', str(old_p1))

          loader = work / 'src/llama-model-loader.cpp'
          t = loader.read_text()
          old = '''    // without mmap, tensors in non-host buffers are staged through a temporary buffer sized like the tensor
    // load them biggest-first so the largest staging buffer is allocated while the fewest weights are resident
    if (!use_mmap) {
        std::stable_sort(tensors.begin(), tensors.end(), [](const ggml_tensor * a, const ggml_tensor * b) {
            const bool staged_a = a->buffer && !ggml_backend_buffer_is_host(a->buffer);
            const bool staged_b = b->buffer && !ggml_backend_buffer_is_host(b->buffer);
            if (staged_a != staged_b) {
                return staged_a;
            }
            return staged_a && ggml_nbytes(a) > ggml_nbytes(b);
        });
    }
'''
          new = '''    // Load tensors largest-first for non-host buffers. This also applies to mmap loads,
    // where Vulkan device allocations are still created progressively and allocation order
    // can otherwise leave the allocator fragmented before large weights are allocated.
    std::stable_sort(tensors.begin(), tensors.end(), [](const ggml_tensor * a, const ggml_tensor * b) {
        const bool staged_a = a->buffer && !ggml_backend_buffer_is_host(a->buffer);
        const bool staged_b = b->buffer && !ggml_backend_buffer_is_host(b->buffer);
        if (staged_a != staged_b) {
            return staged_a;
        }
        return staged_a && ggml_nbytes(a) > ggml_nbytes(b);
    });
'''
          if old not in t:
              raise SystemExit('expected tensor ordering block not found')
          loader.write_text(t.replace(old, new, 1))

          model = work / 'src/llama-model.cpp'
          t = model.read_text()
          old = '    const bool use_mmap_buffer = true;\n'
          new = '''#if defined(__ANDROID__)
    // Android Vulkan drivers, especially UMA/mobile drivers, may not safely support
    // importing the mmap address directly as a backend buffer. Use normal backend
    // allocations and let the loader upload the mapped tensor data instead.
    const bool use_mmap_buffer = false;
#else
    const bool use_mmap_buffer = true;
#endif
'''
          if old not in t:
              raise SystemExit('expected use_mmap_buffer declaration not found')
          model.write_text(t.replace(old, new, 1))

          generated = run('git', 'diff', '--no-ext-diff', '--no-color', '--', 'src/llama-model-loader.cpp', 'src/llama-model.cpp')
          if not generated.startswith('diff --git '):
              raise SystemExit('generated combined model patch is empty')
          old_p1.write_text(generated)

          # Validate the complete checked-in stack against the exact pinned revision.
          run('git', 'reset', '--hard', '--quiet', tag)
          run('git', 'clean', '-fd', '-q')
          for p in (old_p1, p2, p3):
              run('git', 'apply', '--recount', '--check', str(p))
              run('git', 'apply', '--recount', str(p))
          print('VALIDATED: canonical model-loader + Android mmap-buffer fix and all three checked-in patches apply to pinned revision')
          PY
      - name: Commit canonical patch
        run: |
          set -euo pipefail
          git config user.name patch-generator
          git config user.email patch-generator@localhost
          git add core/runtime-android/src/main/cpp/patches/llama-model-loading-memory.patch
          git commit -m "fix: avoid Android Vulkan mmap buffer import" || exit 0
          git push

# trigger canonical regeneration after workflow update
