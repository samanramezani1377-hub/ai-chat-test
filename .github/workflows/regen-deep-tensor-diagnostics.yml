name: Temporary Deep Tensor Diagnostics Regeneration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Regenerate canonical Vulkan diagnostics patch
        run: |
          set -euo pipefail
          TAG=c5fc7e34885ba31217e330809437afa993d27745
          WORK="$RUNNER_TEMP/llama-regenerate"
          rm -rf "$WORK"
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$WORK"
          git -C "$WORK" checkout --quiet --detach "$TAG"
          git -C "$WORK" config user.name patch-generator
          git -C "$WORK" config user.email patch-generator@localhost

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import os

          root = Path('.').resolve()
          work = Path(os.environ['RUNNER_TEMP']) / 'llama-regenerate'
          patch_dir = root / 'core/runtime-android/src/main/cpp/patches'
          p1 = patch_dir / 'llama-model-loading-memory.patch'
          p2 = patch_dir / 'llama-backend-vulkan-diagnostics.patch'
          p3 = patch_dir / 'llama-vulkan-micro-diagnostics.patch'

          def run(*args):
              return subprocess.run(args, cwd=work, check=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT).stdout

          run('git', 'apply', '--recount', str(p1))
          run('git', 'apply', '--recount', str(p2))

          vulkan = work / 'ggml/src/ggml-vulkan/ggml-vulkan.cpp'
          text = vulkan.read_text()

          # Instrument the real per-tensor write path. The existing patch already assigns a
          # unique trace id to each tensor, so every deeper event can be correlated back to it.
          anchor = 'static void ggml_vk_buffer_write_2d_async(ggml_backend_vk_context * ctx, vk_context * subctx, vk_buffer& dst, size_t offset, const void * src, size_t spitch, size_t width, size_t height, bool sync_staging = false) {'
          if anchor not in text:
              raise SystemExit('write async function anchor not found')
          text = text.replace(anchor, anchor + '''\n    std::cerr << "AI_CHAT_VK_TENSOR_BUFFER_WRITE_BEGIN trace=" << ai_chat_vk_trace()\n              << " dst=" << static_cast<const void *>(dst.get())\n              << " dst_bytes=" << (dst ? dst->size : 0)\n              << " dst_offset=" << offset\n              << " bytes=" << (width * height)\n              << " host_visible=" << ((dst->memory_property_flags & vk::MemoryPropertyFlagBits::eHostVisible) != vk::MemoryPropertyFlagBits{})\n              << std::endl;''', 1)

          anchor = 'ggml_vk_host_get(dst->device, src, buf, buf_offset);'
          if anchor not in text:
              raise SystemExit('host classification anchor not found')
          text = text.replace(anchor, anchor + '\n    std::cerr << "AI_CHAT_VK_SOURCE_CLASSIFIED trace=" << ai_chat_vk_trace() << " pinned=" << (buf != nullptr) << " source_offset=" << buf_offset << std::endl;', 1)

          anchor = 'subctx->s->buffer.copyBuffer(buf->buffer, dst->buffer, slices);'
          if anchor not in text:
              raise SystemExit('pinned copy anchor not found')
          text = text.replace(anchor, 'std::cerr << "AI_CHAT_VK_UPLOAD_COMMAND_BEGIN trace=" << ai_chat_vk_trace() << " mode=pinned bytes=" << (width * height) << std::endl;\n        ' + anchor + '\n        std::cerr << "AI_CHAT_VK_UPLOAD_COMMAND_RECORDED trace=" << ai_chat_vk_trace() << " mode=pinned bytes=" << (width * height) << std::endl;', 1)

          anchor = 'const size_t copy_size = width*height;'
          if anchor not in text:
              raise SystemExit('staging copy size anchor not found')
          text = text.replace(anchor, anchor + '\n    std::cerr << "AI_CHAT_VK_STAGING_PATH_BEGIN trace=" << ai_chat_vk_trace() << " copy_bytes=" << copy_size << std::endl;', 1)

          anchor = 'ggml_vk_ensure_sync_staging_buffer(ctx, copy_size);'
          if anchor not in text:
              raise SystemExit('staging ensure anchor not found')
          text = text.replace(anchor, 'std::cerr << "AI_CHAT_VK_STAGING_ALLOC_CALL trace=" << ai_chat_vk_trace() << " requested_bytes=" << copy_size << std::endl;\n                ' + anchor + '\n                std::cerr << "AI_CHAT_VK_STAGING_ALLOC_RETURNED trace=" << ai_chat_vk_trace() << " buffer=" << static_cast<const void *>(ctx->sync_staging.get()) << " bytes=" << (ctx->sync_staging ? ctx->sync_staging->size : 0) << std::endl;', 1)

          anchor = 'vkCmdCopyBuffer(subctx->s->buffer, staging->buffer, dst->buffer, 1, &buf_copy);'
          if anchor not in text:
              raise SystemExit('staging copy command anchor not found')
          text = text.replace(anchor, 'std::cerr << "AI_CHAT_VK_UPLOAD_COMMAND_BEGIN trace=" << ai_chat_vk_trace() << " mode=staging bytes=" << copy_size << " staging=" << static_cast<const void *>(staging.get()) << std::endl;\n    ' + anchor + '\n    std::cerr << "AI_CHAT_VK_UPLOAD_COMMAND_RECORDED trace=" << ai_chat_vk_trace() << " mode=staging bytes=" << copy_size << std::endl;', 1)

          anchor = 'ggml_vk_buffer_write_2d(ctx, dst, offset, src, 0, size, 1);'
          if anchor not in text:
              raise SystemExit('sync write anchor not found')
          text = text.replace(anchor, 'std::cerr << "AI_CHAT_VK_UPLOAD_WAIT_BEGIN trace=" << ai_chat_vk_trace() << " bytes=" << size << std::endl;\n    ' + anchor + '\n    std::cerr << "AI_CHAT_VK_UPLOAD_WAIT_RETURNED trace=" << ai_chat_vk_trace() << " bytes=" << size << std::endl;', 1)

          anchor = 'std::cerr << "AI_CHAT_VK_SET_TENSOR_RETURNED trace=" << ai_chat_vk_trace() << " tensor=" << static_cast<const void *>(tensor) << " name=" << ggml_get_name(tensor) << " data=" << data << " offset=" << offset << " size=" << size << std::endl;'
          if anchor not in text:
              raise SystemExit('tensor completion anchor not found')
          text = text.replace(anchor, anchor + '\n    std::cerr << "AI_CHAT_VK_TENSOR_LOAD_END trace=" << ai_chat_vk_trace() << " name=" << ggml_get_name(tensor) << " bytes=" << size << std::endl;', 1)

          vulkan.write_text(text)
          new_p3 = run('git', 'diff', '--no-ext-diff', '--no-color', '--', 'ggml/src/ggml-vulkan/ggml-vulkan.cpp')
          if not new_p3.strip():
              raise SystemExit('empty regenerated patch3')
          p3.write_text(new_p3)

          run('git', 'reset', '--hard', '--quiet', TAG)
          run('git', 'clean', '-fd', '-q')
          for p in (p1, p2, p3):
              run('git', 'apply', '--check', str(p))
              run('git', 'apply', str(p))
          print('VALIDATED: all three patches')
          PY

      - name: Commit canonical patch
        run: |
          set -euo pipefail
          git config user.name patch-generator
          git config user.email patch-generator@localhost
          git add core/runtime-android/src/main/cpp/patches/llama-vulkan-micro-diagnostics.patch
          git commit -m "diag: instrument per-tensor Vulkan upload lifecycle" || exit 0
          git push
