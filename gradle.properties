android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keep the Gradle daemon warm and give Android/Kotlin compilation enough heap.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# Faster repeat builds and parallel independent module tasks.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
kotlin.incremental=true
