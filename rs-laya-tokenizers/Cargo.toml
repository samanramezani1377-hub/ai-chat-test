[package]
name = "laya_tokenizers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokenizers = { version = "0.22.1", default-features = false, features = ["onig"] }
jni = "0.21.1"

[lib]
name = "laya_tokenizers"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
